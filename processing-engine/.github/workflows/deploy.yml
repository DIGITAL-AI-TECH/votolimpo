name: Deploy Processing Engine

on:
  push:
    branches: [master]
    paths: ['processing-engine/**']
  workflow_dispatch:

env:
  REGISTRY: registry.digital-ai.tech
  IMAGE: registry.digital-ai.tech/processing-engine
  N8N_NOTIFY_URL: https://webhook.digital-ai.tech/webhook/1c708636-864f-469d-8540-0dab5c145c7c

jobs:
  # ─── Notify Start ────────────────────────────────────────
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: Notify — Pipeline Iniciado
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'started','repo':'processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ.get('COMMIT_MSG','manual dispatch'),
              'run_url':os.environ['RUN_URL'],
              'stage':'Pipeline','message':'Pipeline iniciado — processing-engine'
            }))")" || true

  # ─── Tests ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: notify-start
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: processing-engine
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: processing-engine
        run: pytest tests/ -q --tb=short

      - name: Notify — Tests OK
        if: success()
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Tests','message':'Testes passaram com sucesso'
            }))")" || true

      - name: Notify — Tests Falharam
        if: failure()
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Tests','message':'Testes falharam — pipeline interrompido'
            }))")" || true

  # ─── Build & Push Image ──────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build & push image
        id: meta
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:8}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          docker build \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${SHORT_SHA} \
            processing-engine/

          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${SHORT_SHA}

      - name: Notify — Build OK
        if: success()
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA:0:8}"
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Build','message':'Imagem publicada: ${{ env.IMAGE }}:${SHORT_SHA}'
            }))")" || true

      - name: Notify — Build Falhou
        if: failure()
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Build','message':'Build ou push da imagem falhou'
            }))")" || true

  # ─── Deploy via Portainer API ────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Notify — Deploy em Andamento
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy','message':'Atualizando stack processing-engine via Portainer API'
            }))")" || true

      - uses: actions/checkout@v4

      - name: Deploy via Portainer API
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: ${{ secrets.PE_STACK_ID }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:8}"

          # Replace image tag in stack file for production traceability
          sed -i "s|processing-engine:latest|processing-engine:${SHORT_SHA}|g" processing-engine/docker-stack.yml

          COMPOSE_CONTENT=$(cat processing-engine/docker-stack.yml | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          curl -sf -X PUT "${PORTAINER_URL}/api/stacks/${STACK_ID}?endpointId=4" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"StackFileContent\": ${COMPOSE_CONTENT}, \"Prune\": false}"

      - name: Notify — Deploy Concluido
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA:0:8}"
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'success','repo':'processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ.get('COMMIT_MSG','manual dispatch'),
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy','message':'Deploy concluido! Versao: ${{ env.IMAGE }}:${SHORT_SHA}'
            }))")" || true

      - name: Notify — Deploy Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ.get('COMMIT_MSG','manual dispatch'),
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy','message':'Deploy falhou — verificar logs do Portainer'
            }))")" || true

  # ─── Health Check ────────────────────────────────────────
  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for service startup
        run: sleep 30

      - name: Health check — PE
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -skf -o /dev/null -w "%{http_code}" https://processing-engine.digital-ai.tech/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "PE health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status=${STATUS}, retrying in 5s..."
            sleep 5
          done
          echo "PE health check failed after 10 attempts"
          exit 1

      - name: Notify — Health Check OK
        if: success()
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'success','repo':'processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Health Check','message':'PE respondendo em https://processing-engine.digital-ai.tech/health'
            }))")" || true

      - name: Notify — Health Check Falhou
        if: failure()
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Health Check','message':'PE nao respondeu em /health apos 10 tentativas — verificar servico'
            }))")" || true
