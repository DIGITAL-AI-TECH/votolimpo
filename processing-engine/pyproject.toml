[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "processing-engine"
version = "1.0.0"
description = "Agnostic document processing engine with plugin-based pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyMuPDF>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "jsonschema>=4.22.0",
    "PyYAML>=6.0",
    "alembic>=1.13.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pgvector>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[postgres]>=4.7.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "db_models"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "db_models"]
