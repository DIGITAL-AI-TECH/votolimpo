version: "3.8"

services:
  api:
    image: registry.digital-ai.tech/processing-engine:${TAG:-latest}
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=processing_engine
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_KEY=${API_KEY}
      - ENGINE_ROLE=both
      - WORKER_POLL_INTERVAL_SECONDS=1.0
      - LOG_LEVEL=INFO
      - BATCHER_ENABLED=true
      - BATCHER_POLL_INTERVAL_SECONDS=5
      - BATCHER_DEFAULT_BATCH_SIZE=50
    networks:
      - traefik_public
      - pe-net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.processing-engine.rule=Host(`processing-engine.digital-ai.tech`)"
        - "traefik.http.routers.processing-engine.entrypoints=websecure"
        - "traefik.http.routers.processing-engine.tls.certresolver=letsencrypt"
        - "traefik.http.services.processing-engine.loadbalancer.server.port=8000"
        # HTTP -> HTTPS redirect
        - "traefik.http.routers.processing-engine-http.rule=Host(`processing-engine.digital-ai.tech`)"
        - "traefik.http.routers.processing-engine-http.entrypoints=web"
        - "traefik.http.routers.processing-engine-http.middlewares=redirect-to-https"
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; r=httpx.get('http://localhost:8000/health'); exit(0 if r.status_code in (200,503) else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=processing_engine
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data
    networks:
      - pe-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d processing_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  traefik_public:
    external: true
  pe-net:
    driver: overlay
    attachable: true

volumes:
  pgdata:
