version: "3.8"

services:
  pe-postgres:
    image: pgvector/pgvector:pg16
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    environment:
      POSTGRES_PASSWORD: "vnBnBsOrtrLtx-DbYlO5VpyOGx94XHhe"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pe-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == oraculus-server-2
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s

  api:
    image: registry.digital-ai.tech/processing-engine:${IMAGE_TAG:-latest}
    environment:
      API_KEY: "${PE_API_KEY}"
      DATABASE_URL: "${PE_DATABASE_URL}"
      VOTOLIMPO_DATABASE_URL: "${PE_VOTOLIMPO_DATABASE_URL}"
      OPENAI_API_KEY: "${PE_OPENAI_API_KEY}"
      ENGINE_ROLE: "both"
      WORKER_CONCURRENCY: "2"
      WORKER_POLL_INTERVAL: "2"
      LOG_LEVEL: "info"
    networks:
      - oraculusnet
      - pe-net
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.processing-engine.rule=Host(`processing-engine.digital-ai.tech`)"
        - "traefik.http.routers.processing-engine.entrypoints=websecure"
        - "traefik.http.routers.processing-engine.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.processing-engine-http.rule=Host(`processing-engine.digital-ai.tech`)"
        - "traefik.http.routers.processing-engine-http.entrypoints=web"
        - "traefik.http.routers.processing-engine-http.middlewares=redirect-to-https"
        - "traefik.http.services.processing-engine.loadbalancer.server.port=8000"
        - "traefik.docker.network=oraculusnet"
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

networks:
  oraculusnet:
    external: true
  pe-net:
    driver: overlay

volumes:
  pgdata:
    external: true
    name: processing-engine_pgdata
