version: "3.8"

services:
  api:
    image: ${REGISTRY:-registry.digital-ai.tech}/processing-engine:${TAG:-latest}
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/processing_engine
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_KEY=${API_KEY}
      - ENGINE_ROLE=both
      - WORKER_POLL_INTERVAL_SECONDS=1.0
      - LOG_LEVEL=INFO
    networks:
      - traefik-public
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.processing-engine.rule=Host(`processing-engine.digital-ai.tech`)"
        - "traefik.http.routers.processing-engine.entrypoints=websecure"
        - "traefik.http.routers.processing-engine.tls.certresolver=le"
        - "traefik.http.services.processing-engine.loadbalancer.server.port=8000"
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=processing_engine
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data
    networks:
      - internal
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  traefik-public:
    external: true
  internal:
    driver: overlay

volumes:
  pgdata:
