id: helpcore-inventory
name: helpcore-inventory
description: >
  Classificacao e inventario de artigos da base de conhecimento Help Bradesco.
  Extrai tipo, categoria, publico-alvo, qualidade textual e metadados.

ingestor_type: auto
dedup_strategy: composite
dedup_config:
  hash_fields: [content]
  url_normalize: true

llm_provider: openai
llm_model: gpt-4.1-mini
llm_temperature: 0.0
llm_max_tokens: 8192

system_prompt: |
  Voce e um especialista em gestao de conhecimento corporativo do setor bancario brasileiro.
  Analise o artigo da base de conhecimento do Bradesco e extraia informacoes estruturadas.

  Classifique o artigo segundo:
  - doc_type: tipo do documento (procedimento, passo_a_passo, checklist, faq, referencia, politica, outro)
  - category: categoria tematica (ex: cancelamento, bloqueio, credito, fraude, cadastro, contestacao, cartao, pix, transferencia, emprestimo, investimento, seguro, conta, atendimento, cobranca, senha, risco, digital, outro)
  - subcategory: subcategoria especifica dentro da category, ex:
      cartao: [segunda_via, desbloqueio, limite, anuidade, contestacao_fatura, cartao_virtual, aproximacao]
      credito: [analise_risco, consignado, financiamento, renegociacao, limite_credito, cheque_especial]
      fraude: [clonagem, phishing, engenharia_social, compra_indevida, prevencao, investigacao]
      conta: [abertura, encerramento, tarifas, extrato, atualizacao_cadastral, conta_salario, conta_poupanca]
      pix: [cadastro_chave, limite, devolucao, agendamento, pix_saque, pix_troco, falha]
      cancelamento: [produto, servico, seguro, consorcio, previdencia]
      atendimento: [reclamacao, ouvidoria, protocolo, sla, escalacao, recontato]
      bloqueio: [senha, cartao, conta, judicial, cautelar]
      cadastro: [pessoa_fisica, pessoa_juridica, procuracao, atualizacao, biometria]
      transferencia: [ted, doc, entre_contas, internacional, agendada]
      emprestimo: [contratacao, simulacao, antecipacao, quitacao, portabilidade]
      investimento: [renda_fixa, renda_variavel, fundos, previdencia, cdb, lci_lca]
      seguro: [vida, residencial, auto, viagem, prestamista, sinistro]
      cobranca: [contato_indevido, negativacao, acordo, boleto, regularizacao]
      senha: [desbloqueio, segunda_via, redefinicao, senha_eletronica, token]
      contestacao: [fatura, debito, tarifa, cobranca_indevida]
      risco: [analise_pf, analise_pj, alerta, monitoramento]
      digital: [app, internet_banking, bia, chat, totem]
      outro: [geral]
    Escolha a subcategoria mais especifica possivel. Se nenhuma se aplica, use "geral".
  - target_audience: publico-alvo principal (operador, supervisor, tecnico, cliente, multiplo)
  - quality_score: qualidade textual de 0-100 (clareza, organizacao, linguagem profissional)
  - completeness_score: completude de 0-100 (passos claros, informacoes completas, sem lacunas)
  - key_topics: lista de 3-8 topicos principais do artigo
  - summary: resumo factual de 1-2 frases do procedimento/conteudo
  - requires_update: true se houver indicios de conteudo desatualizado (datas antigas, sistemas obsoletos, referencias quebradas)

  REGRAS:
  - Se o artigo for apenas um link sem conteudo textual, retorne doc_type="referencia", quality_score=10, completeness_score=5
  - Se o artigo for muito curto (menos de 50 palavras), ajuste quality_score proporcionalmente
  - Responda EXCLUSIVAMENTE com JSON valido no formato do schema

output_schema:
  type: object
  required: [doc_type, category, subcategory, target_audience, quality_score, completeness_score, key_topics, summary, requires_update]
  additionalProperties: false
  properties:
    doc_type:
      type: string
      enum: [procedimento, passo_a_passo, checklist, faq, referencia, politica, outro]
    category:
      type: string
    subcategory:
      type: string
    target_audience:
      type: string
      enum: [operador, supervisor, tecnico, cliente, multiplo]
    quality_score:
      type: number
      minimum: 0
      maximum: 100
    completeness_score:
      type: number
      minimum: 0
      maximum: 100
    key_topics:
      type: array
      items:
        type: string
    summary:
      type: string
    requires_update:
      type: boolean

validators: [schema]

sink_type: postgresql
sink_config:
  database_url_env: HELPCORE_DATABASE_URL
  table: help_core.inventory
  conflict_column: pe_item_id
  column_mapping:
    doc_type: doc_type
    category: category
    target_audience: target_audience
    quality_score: quality_score
    completeness_score: completeness_score
    subcategory: subcategory
  item_field_mapping:
    source_url: source_url
    titulo: title
  jsonb_fallback: metadata

max_concurrent: 5
rate_limit_rpm: 60
max_retries: 2
budget_limit_usd: 50.0
budget_period: month
cache:
  enabled: true
  ttl_hours: 720
