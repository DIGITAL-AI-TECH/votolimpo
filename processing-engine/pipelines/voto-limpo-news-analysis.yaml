id: a09099b0-147e-42ab-831b-7b3c1e46bdc1
name: voto-limpo-news-analysis
description: >
  Pipeline de analise de noticias politicas brasileiras. Extrai politicos,
  severity, veracidade e keywords usando GPT-4.1-mini com structured output.
  Persiste no schema votolimpo.*.

# --- Ingestao ---
ingestor_type: auto  # detecta HTML/text/JSON automaticamente

# --- Dedup ---
dedup_strategy: composite  # hash + semantic
dedup_config:
  strategies: [hash, semantic]
  semantic_threshold: 0.92

# --- LLM ---
llm_provider: openai
llm_model: gpt-4.1-mini
llm_temperature: 0.1
llm_seed: 42
llm_max_tokens: 2000

system_prompt: |
  Analista de inteligencia politica brasileira. Extraia dados estruturados de noticias.

  REGRAS:
  1. Extraia APENAS informacoes EXPLICITAS no texto. Campos indeterminaveis = null.
  2. NAO infira causalidade, intencoes ou relacoes nao declaradas.
  3. Severity reflete o FATO, nao a manchete. Keywords identificam o EVENTO, nao termos genericos.
  4. article_role do politico: use o papel MAIS ESPECIFICO (investigated > mentioned).
  5. is_political: false se o tema central nao e politico, mesmo mencionando politicos.
  6. source_reputation: 0.0-1.0 baseado na reputacao GERAL da fonte, nao da materia.

  Responda EXCLUSIVAMENTE com JSON valido no formato do schema.

user_prompt_template: |
  Analise a seguinte noticia politica brasileira.

  Titulo: {title}
  Fonte: {source_name}
  Data de publicacao: {published_date}

  Conteudo:
  {content}

output_schema:
  type: object
  required:
    - politicians
    - severity
    - summary
    - keywords
    - veracity_signals
    - is_political
  additionalProperties: false
  properties:
    politicians:
      type: array
      items:
        type: object
        required: [name, party, state, role, article_role, relevance_score]
        additionalProperties: false
        properties:
          name: { type: string }
          party: { type: [string, "null"] }
          state: { type: [string, "null"] }
          role: { type: [string, "null"] }
          article_role:
            type: string
            enum: [protagonist, mentioned, investigated, witness, victim, other]
          relevance_score: { type: number, minimum: 0.0, maximum: 1.0 }
    severity:
      type: string
      enum: [low, medium, high, critical]
    summary:
      type: string
      maxLength: 300
    keywords:
      type: array
      items: { type: string }
    veracity_signals:
      type: object
      required:
        - source_reputation
        - multi_source
        - narrative_consistency
        - documental_evidence
        - temporality
        - emotional_language
      additionalProperties: false
      properties:
        source_reputation: { type: number, minimum: 0.0, maximum: 1.0 }
        multi_source: { type: number, minimum: 0.0, maximum: 1.0 }
        narrative_consistency: { type: number, minimum: 0.0, maximum: 1.0 }
        documental_evidence: { type: number, minimum: 0.0, maximum: 1.0 }
        temporality: { type: number, minimum: 0.0, maximum: 1.0 }
        emotional_language: { type: number, minimum: 0.0, maximum: 1.0 }
    is_political: { type: boolean }

# --- Validators ---
validators: [schema, grounding, range]
validator_config:
  grounding:
    min_overlap_ratio: 0.3  # 30% das keywords devem aparecer no texto
  range:
    ranges:
      "veracity_signals.source_reputation": [0.0, 1.0]
      "veracity_signals.multi_source": [0.0, 1.0]
      "veracity_signals.narrative_consistency": [0.0, 1.0]
      "veracity_signals.documental_evidence": [0.0, 1.0]
      "veracity_signals.temporality": [0.0, 1.0]
      "veracity_signals.emotional_language": [0.0, 1.0]

# --- Post-Processors ---
# score_calculator: pure math, no tokens. article_matcher + cluster_updater: SQL only.
# entity_resolver, relationship_builder, milestone_detector: disabled (fields removed from schema).
post_processors:
  - type: score_calculator
    config:
      weights:
        source_reputation: 0.30
        multi_source: 0.25
        narrative_consistency: 0.15
        documental_evidence: 0.10
        temporality: 0.10
        emotional_language: 0.10
      output_field: veracity_score

  - type: article_matcher
    config:
      match_table: votolimpo.article_matches
      weights:
        entity_overlap: 0.40
        keyword_overlap: 0.35
        temporal_proximity: 0.25
      persist_threshold: 0.30
      window_days: 30

  - type: cluster_updater
    config:
      cluster_table: votolimpo.news_clusters
      cluster_articles_table: votolimpo.cluster_articles
      cluster_politicians_table: votolimpo.cluster_politicians
      similarity_threshold: 0.50

# --- Sink ---
# Using "none" — NC fetches results via callback and writes to its own DB.
# The PE stores all outputs in job_items.output (always).
sink_type: none
sink_config: {}

# --- Crons (executados pelo worker deste pipeline) ---
# Crons removidos (handlers inexistentes — dead config detectada em audit 2026-09-11):
#   recalculate_politician_scores, update_source_reputation,
#   regenerate_content, deactivate_stale_clusters
crons:
  - name: refresh_materialized_views
    schedule: "0 */6 * * *"  # cada 6h
    handler: mv_refresher.refresh_all

# --- Limites ---
max_concurrent: 5
rate_limit_rpm: 60
max_retries: 1
cache_ttl_hours: 720
budget_limit_usd: 10.0
budget_period: month
