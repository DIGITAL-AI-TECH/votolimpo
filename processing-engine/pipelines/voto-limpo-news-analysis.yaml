id: a09099b0-147e-42ab-831b-7b3c1e46bdc1
name: voto-limpo-news-analysis
description: >
  Pipeline de analise de noticias politicas brasileiras. Extrai politicos,
  severity, veracidade e keywords usando GPT-4.1-mini com structured output.
  Persiste no schema votolimpo.*.

# --- Ingestao ---
ingestor_type: auto  # detecta HTML/text/JSON automaticamente

# --- Dedup ---
# Composite: hash-based exact dedup on content. Checks processing_engine.cache
# table for existing content_hash. Old stale entries (ttl=0) are already expired
# and won't cause false positives (query filters expires_at > NOW()).
dedup_strategy: composite
dedup_config:
  hash_fields: [content]
  url_normalize: true

# --- LLM ---
llm_provider: openai
llm_model: gpt-4.1-mini
llm_temperature: 0.1
llm_seed: 42
llm_max_tokens: 16384

system_prompt: |
  Analista de inteligencia politica brasileira. Extraia dados estruturados de noticias.

  REGRAS:
  1. Extraia APENAS informacoes EXPLICITAS no texto. Campos indeterminaveis = null.
  2. NAO infira causalidade, intencoes ou relacoes nao declaradas.
  3. Severity reflete o FATO, nao a manchete. Keywords identificam o EVENTO, nao termos genericos.
  4. article_role do politico: use o papel MAIS ESPECIFICO (investigated > mentioned).
  5. is_political: false se o tema central nao e politico, mesmo mencionando politicos.
  6. Avalie CADA artigo INDIVIDUALMENTE. Nunca reutilize scores de artigos anteriores.

  SINAIS DE VERACIDADE (0.0 a 1.0 cada — avalie COM BASE NO CONTEUDO do artigo):
  - source_reputation: reputacao da fonte jornalistica. Folha/Estadao/G1/BBC/Reuters = 0.7-0.9. Blog/portal desconhecido = 0.2-0.4. Se a fonte nao for identificavel, use 0.3.
  - multi_source: o artigo cita ou referencia OUTRAS fontes/veiculos/documentos oficiais? 0.0 = fonte unica sem referencias. 0.5 = menciona "segundo fontes" generico. 0.8-1.0 = cita documentos oficiais, outras materias, relatorios.
  - narrative_consistency: a narrativa e coerente internamente? 0.8-1.0 = sem contradicoes, logica clara. 0.3-0.5 = tem lacunas ou saltos logicos. 0.0-0.2 = contradiz a si mesmo.
  - documental_evidence: ha evidencia documental? 0.8-1.0 = cita numeros de processo, documentos oficiais, dados concretos. 0.4-0.6 = referencias vagas a documentos. 0.0-0.2 = puramente baseado em declaracoes.
  - temporality: precisao temporal. 0.8-1.0 = datas exatas, linha do tempo clara. 0.4-0.6 = "recentemente", "nos ultimos dias". 0.0-0.2 = sem nenhuma referencia temporal.
  - emotional_language: 1.0 = linguagem jornalistica neutra e factual. 0.5 = alguma parcialidade mas ainda informativo. 0.0 = altamente sensacionalista, clickbait, linguagem emocional.

  SEVERITY (avalie com base no CONTEUDO FACTUAL, nao na manchete):
  - low: mencao casual, citacao em contexto positivo/neutro, fato administrativo rotineiro
  - medium: investigacao preliminar, denuncia sem desdobramento, polemica sem acao judicial
  - high: acao judicial formal, CPI, cassacao, condenacao em primeira instancia
  - critical: prisao, condenacao definitiva, escandalo de grande repercussao nacional

  KEYWORDS: identifique 3-8 palavras-chave do EVENTO especifico (nao termos genericos como "politica" ou "brasil").

  SUMMARY: resumo factual de 1-3 frases do conteudo da noticia. Maximo 500 caracteres.

  MILESTONES (marcos juridicos/politicos):
  Se o artigo descreve um evento juridico ou politico significativo para um dos politicos mencionados, extraia os milestones.
  Tipos validos: inquiry (inquerito), complaint (denuncia), conviction (condenacao), acquittal (absolvicao), arrest (prisao), impeachment (impeachment), plea_deal (acordo de delacao/plea), fine (multa).
  Para CADA milestone:
  - politician_name: nome EXATO como aparece no campo "politicians"
  - type: um dos tipos validos acima
  - title: titulo descritivo curto (max 100 chars)
  - description: descricao factual do evento (max 300 chars, ou null se nao houver detalhes)
  - date: data do evento no formato YYYY-MM-DD (se mencionada explicitamente, senao use a data de publicacao)
  - confidence: 0.0-1.0 (quao confiante voce esta de que este milestone realmente ocorreu)
  Se nao houver milestones relevantes, retorne array vazio.

  Responda EXCLUSIVAMENTE com JSON valido no formato do schema.

user_prompt_template: |
  Analise a seguinte noticia politica brasileira.

  Titulo: {title}
  Fonte: {source_name}
  Data de publicacao: {published_date}

  Conteudo:
  {content}

output_schema:
  type: object
  required:
    - politicians
    - severity
    - summary
    - keywords
    - veracity_signals
    - is_political
    - entity_names
    - milestones
  additionalProperties: false
  properties:
    politicians:
      type: array
      items:
        type: object
        required: [name, party, state, role, article_role, relevance_score]
        additionalProperties: false
        properties:
          name: { type: string }
          party: { type: ["string", "null"] }
          state: { type: ["string", "null"] }
          role: { type: ["string", "null"] }
          article_role:
            type: string
            enum: [protagonist, mentioned, investigated, witness, victim, other]
          relevance_score: { type: number }
    severity:
      type: string
      enum: [low, medium, high, critical]
    summary:
      type: string
    keywords:
      type: array
      items: { type: string }
    veracity_signals:
      type: object
      required:
        - source_reputation
        - multi_source
        - narrative_consistency
        - documental_evidence
        - temporality
        - emotional_language
      additionalProperties: false
      properties:
        source_reputation: { type: number }
        multi_source: { type: number }
        narrative_consistency: { type: number }
        documental_evidence: { type: number }
        temporality: { type: number }
        emotional_language: { type: number }
    is_political: { type: boolean }
    entity_names:
      type: array
      items: { type: string }
    milestones:
      type: array
      items:
        type: object
        required: [politician_name, type, title, description, date, confidence]
        additionalProperties: false
        properties:
          politician_name: { type: string }
          type:
            type: string
            enum: [inquiry, complaint, conviction, acquittal, arrest, impeachment, plea_deal, fine]
          title: { type: string }
          description: { type: ["string", "null"] }
          date: { type: string }
          confidence: { type: number }

# --- Validators ---
validators: [schema, grounding, range]
validator_config:
  grounding:
    min_overlap_ratio: 0.3  # 30% das keywords devem aparecer no texto
  range:
    ranges:
      "veracity_signals.source_reputation": [0.0, 1.0]
      "veracity_signals.multi_source": [0.0, 1.0]
      "veracity_signals.narrative_consistency": [0.0, 1.0]
      "veracity_signals.documental_evidence": [0.0, 1.0]
      "veracity_signals.temporality": [0.0, 1.0]
      "veracity_signals.emotional_language": [0.0, 1.0]

# --- Post-Processors ---
# score_calculator: pure math, no tokens. article_matcher + cluster_updater: SQL only.
# milestone_detector: ativo — persiste milestones extraidos pelo LLM em votolimpo.milestones.
# entity_resolver: resolves politician names to DB IDs (required by milestone_detector).
# relationship_builder: disabled (fields removed from schema).
post_processors:
  # Phase 1 — Pre-sink: pure computation (no article_id needed)
  - type: score_calculator
    config:
      weights:
        source_reputation: 0.30
        multi_source: 0.25
        narrative_consistency: 0.15
        documental_evidence: 0.10
        temporality: 0.10
        emotional_language: 0.10
      output_field: veracity_score

  # Phase 2 — Post-sink (all need article_id from sink RETURNING id):
  # ORDER MATTERS: entity_resolver MUST run before article_matcher and
  # cluster_updater because they query politician_articles which entity_resolver populates.
  # milestone_detector needs resolved_politician_ids from entity_resolver.
  # score_persister needs resolved_politician_ids from entity_resolver.
  - type: entity_resolver
    config:
      politician_table: votolimpo.politicians
      entity_table: votolimpo.entities
      fuzzy_threshold: 0.80
      fuzzy_party_threshold: 0.70

  - type: score_persister
    config:
      history_table: votolimpo.score_history

  - type: milestone_detector
    config:
      milestone_table: votolimpo.milestones
      confidence_threshold: 0.70
      dedup_window_days: 7

  - type: article_matcher
    config:
      match_table: votolimpo.article_matches
      weights:
        entity_overlap: 0.40
        keyword_overlap: 0.35
        temporal_proximity: 0.25
      persist_threshold: 0.30
      window_days: 30

  - type: cluster_updater
    config:
      cluster_table: votolimpo.news_clusters
      cluster_articles_table: votolimpo.cluster_articles
      cluster_politicians_table: votolimpo.cluster_politicians
      similarity_threshold: 0.50

# --- Sink ---
# Persist directly to votolimpo.articles via column_mapping UPSERT.
# PE also stores all outputs in job_items.output (always).
sink_type: postgresql
sink_config:
  database_url_env: VOTOLIMPO_DATABASE_URL
  table: votolimpo.articles
  conflict_column: url_hash
  column_mapping:
    summary: summary
    severity: severity
    keywords: keywords
    veracity_score: veracity_score
    score_components: score_components
    is_political: is_political
    # LLM returns veracity_signals; score_calculator copies them to score_components.
    # Map from veracity_signals (LLM output, preserved through post-processors).
    "veracity_signals.source_reputation": source_reputation
    "veracity_signals.multi_source": multi_source_score
    "veracity_signals.narrative_consistency": narrative_consistency
    "veracity_signals.documental_evidence": documental_evidence
    "veracity_signals.temporality": temporality_score
    "veracity_signals.emotional_language": emotional_language
  static_columns:
    processing_status: completed
  sql_defaults:
    processed_at: "NOW()"
  item_field_mapping:
    source_url: source_url
    nc_article_id: nc_article_id
    title: title
  jsonb_fallback: raw_output
  type_casts:
    severity: "votolimpo.severity_level"
    processing_status: "votolimpo.processing_status"
    score_components: jsonb
  array_columns:
    - keywords

# --- Crons ---
# Crons NÃO são configurados por pipeline — são GLOBAIS do PE, gerenciados pelo
# APScheduler em app/cron/__init__.py. Os 5 jobs registrados:
#   - cron_recalculate_scores: diário 03:00 UTC (recalcula scores de políticos)
#   - cron_refresh_mvs: a cada 6h (refresh de materialized views, se existirem)
#   - cron_regenerate_content: domingo 05:00 UTC (bios e AI summaries via LLM)
#   - cron_cleanup_logs: mensal dia 1 02:00 UTC (limpa logs >90 dias)
#   - cron_deactivate_stale_clusters: diário 04:00 UTC (desativa clusters inativos)
crons: []

# --- Limites ---
max_concurrent: 5
rate_limit_rpm: 60
max_retries: 2
budget_limit_usd: 10.0
budget_period: month

# --- Cache ---
# Enabled: cache LLM results for 30 days to avoid reprocessing identical content.
# Dedup (composite) reads from this cache to detect duplicates.
# The orchestrator checks pipeline.cache.enabled (CacheConfig object).
cache:
  enabled: true
  ttl_hours: 720
