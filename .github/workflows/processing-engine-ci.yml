name: Processing Engine CI/CD

on:
  push:
    branches: [main]
    paths: ["processing-engine/**", ".github/workflows/processing-engine-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["processing-engine/**", ".github/workflows/processing-engine-ci.yml"]

# Cancel older runs on the same branch — only latest commit deploys
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digital-ai.tech
  N8N_NOTIFY_URL: https://webhook.digital-ai.tech/webhook/1c708636-864f-469d-8540-0dab5c145c7c
  IMAGE_NAME: registry.digital-ai.tech/processing-engine

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint
  # ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  # ──────────────────────────────────────────────
  # Job 2: Test (depends on lint)
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: processing-engine
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: processing_engine_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/processing_engine_test
      OPENAI_API_KEY: sk-test-dummy-key
      API_KEY: test-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          # Run migrations against service container
          alembic upgrade head
          # Unit + contract tests (no Docker-in-Docker needed)
          # E2E/integration tests use testcontainers and need Docker-in-Docker
          pytest tests/unit tests/contract -v --tb=short

  # ──────────────────────────────────────────────
  # Job 3: Build + Push to Registry (only on main push)
  # ──────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_sha: ${{ steps.meta.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Notify - Pipeline Iniciado
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'started','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Pipeline CI/CD','message':'Pipeline iniciado - lint e testes passaram'
            }))")" || true

      - name: Set image metadata
        id: meta
        run: echo "image_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: processing-engine
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify - Build Concluido
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA:0:8}"
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Build Docker','message':'Imagem pushed: registry.digital-ai.tech/processing-engine:${SHORT_SHA}'
            }))")" || true

      - name: Notify - Build Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Build Docker','message':'Falha no build ou push da imagem Docker'
            }))")" || true

  # ──────────────────────────────────────────────
  # Job 4: Deploy to Docker Swarm (self-hosted runner on Swarm node)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy — Swarm
    runs-on: [self-hosted, swarm]
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Notify - Deploy em Andamento
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Atualizando servico no Docker Swarm...'
            }))")" || true

      - name: Login no Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Pre-pull image
        env:
          TAG: ${{ needs.docker.outputs.image_sha }}
        run: |
          IMG="${IMAGE_NAME}:${TAG}"
          echo "Pulling ${IMG}..."
          timeout 300 docker pull "${IMG}"
          echo "Pull OK."

      - name: Validate secrets
        env:
          DB_PASSWORD: ${{ secrets.PE_DB_PASSWORD }}
          API_KEY: ${{ secrets.PE_API_KEY }}
        run: |
          MISSING=""
          [ -z "${DB_PASSWORD}" ] && MISSING="${MISSING} PE_DB_PASSWORD"
          [ -z "${API_KEY}" ] && MISSING="${MISSING} PE_API_KEY"
          if [ -n "${MISSING}" ]; then
            echo "::error::Missing required GitHub Secrets:${MISSING}"
            exit 1
          fi
          echo "All secrets present (DB_PASSWORD length: ${#DB_PASSWORD})"

      - name: Cleanup orphan services
        run: |
          # Clean up any leftover temp services from previous failed CI runs
          docker service rm pe-pw-sync 2>/dev/null || true

      - name: Deploy stack (preserves PG volume)
        env:
          TAG: ${{ needs.docker.outputs.image_sha }}
          DB_PASSWORD: ${{ secrets.PE_DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY: ${{ secrets.PE_API_KEY }}
        run: |
          export TAG DB_PASSWORD OPENAI_API_KEY API_KEY
          STACK_NAME="processing-engine"

          # Deploy/update the stack — docker stack deploy is idempotent:
          # - First run: creates all services + volumes
          # - Subsequent runs: updates services with new image, PRESERVES volumes
          # NEVER use docker stack rm + docker volume rm — that destroys the database!
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3..."
            if docker stack deploy \
              --compose-file processing-engine/docker-stack.yml \
              --with-registry-auth \
              "${STACK_NAME}"; then
              echo "Stack deployed/updated (volumes preserved)."
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Deploy failed. Retrying in 10s..."
              sleep 10
            else
              echo "::error::Deploy failed after 3 attempts."
              exit 1
            fi
          done

      - name: Health Check
        timeout-minutes: 5
        run: |
          SERVICE_NAME="processing-engine_api"
          echo "Aguardando convergencia dos servicos..."

          # Wait for PostgreSQL to be running
          echo "--- Waiting for PostgreSQL ---"
          for i in $(seq 1 60); do
            PG_STATE=$(docker service ps processing-engine_postgres \
              --filter "desired-state=running" \
              --format "{{.CurrentState}}" 2>/dev/null | head -1 || echo "")
            if echo "${PG_STATE}" | grep -q "^Running"; then
              echo "PostgreSQL running. (${i}×5s)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::PostgreSQL failed to converge within 300s"
              docker service ps processing-engine_postgres --no-trunc 2>&1 | head -10 || true
              docker service logs processing-engine_postgres --tail 30 --raw 2>&1 || true
              exit 1
            fi
            echo "  [$i/60] PostgreSQL: ${PG_STATE}"
            sleep 5
          done

          # Wait for API service to converge
          echo "--- Waiting for API ---"
          echo "Service placement:"
          docker service ps "${SERVICE_NAME}" --format "{{.Node}} {{.CurrentState}}" 2>/dev/null | head -3 || true

          for i in $(seq 1 60); do
            STATE=$(docker service ps "${SERVICE_NAME}" \
              --filter "desired-state=running" \
              --format "{{.CurrentState}}" 2>/dev/null | head -1 || echo "")

            if echo "${STATE}" | grep -q "^Running"; then
              echo "API service running! (${i}×5s)"
              sleep 5
              docker service logs "${SERVICE_NAME}" --tail 10 --raw 2>&1 || true
              exit 0
            fi

            # Diagnostics at key iterations
            if [ "$i" -eq 12 ] || [ "$i" -eq 30 ] || [ "$i" -eq 50 ]; then
              echo "=== DIAGNOSTIC (iteration $i) ==="
              docker service ps "${SERVICE_NAME}" --no-trunc \
                --format "table {{.Name}}\t{{.Node}}\t{{.CurrentState}}\t{{.Error}}" 2>&1 | head -10 || true
              docker service logs "${SERVICE_NAME}" --tail 30 --raw 2>&1 || true
              echo "=== END DIAGNOSTIC ==="
            fi

            echo "  [$i/60] API: ${STATE}"
            sleep 5
          done

          echo "::error::API service failed to converge within 300s"
          docker service ps "${SERVICE_NAME}" --no-trunc \
            --format "table {{.Name}}\t{{.Node}}\t{{.CurrentState}}\t{{.Error}}" 2>&1 | head -15 || true
          docker service logs "${SERVICE_NAME}" --tail 50 --raw 2>&1 || true
          exit 1

      - name: Notify - Deploy Concluido
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'success','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Deploy concluido com sucesso - processing-engine.digital-ai.tech'
            }))")" || true

      - name: Notify - Deploy Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Falha no deploy do processing-engine no Docker Swarm'
            }))")" || true
