name: Processing Engine CI/CD

on:
  push:
    branches: [main]
    paths: ["processing-engine/**", ".github/workflows/processing-engine-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["processing-engine/**", ".github/workflows/processing-engine-ci.yml"]

# Cancel older runs on the same branch — only latest commit deploys
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digital-ai.tech
  N8N_NOTIFY_URL: https://webhook.digital-ai.tech/webhook/1c708636-864f-469d-8540-0dab5c145c7c
  IMAGE_NAME: registry.digital-ai.tech/processing-engine

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint
  # ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  # ──────────────────────────────────────────────
  # Job 2: Test (depends on lint)
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: processing-engine
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: processing_engine_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/processing_engine_test
      OPENAI_API_KEY: sk-test-dummy-key
      API_KEY: test-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          # Run migrations against service container
          alembic upgrade head
          # Unit + contract tests (no Docker-in-Docker needed)
          # E2E/integration tests use testcontainers and need Docker-in-Docker
          pytest tests/unit tests/contract -v --tb=short

  # ──────────────────────────────────────────────
  # Job 3: Build + Push to Registry (only on main push)
  # ──────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_sha: ${{ steps.meta.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Notify - Pipeline Iniciado
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'started','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Pipeline CI/CD','message':'Pipeline iniciado - lint e testes passaram'
            }))")" || true

      - name: Set image metadata
        id: meta
        run: echo "image_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: processing-engine
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify - Build Concluido
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA:0:8}"
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Build Docker','message':'Imagem pushed: registry.digital-ai.tech/processing-engine:${SHORT_SHA}'
            }))")" || true

      - name: Notify - Build Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Build Docker','message':'Falha no build ou push da imagem Docker'
            }))")" || true

  # ──────────────────────────────────────────────
  # Job 4: Deploy to Docker Swarm (self-hosted runner on Swarm node)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy — Swarm
    runs-on: [self-hosted, swarm]
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Notify - Deploy em Andamento
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Atualizando servico no Docker Swarm...'
            }))")" || true

      - name: Login no Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Clean broken stack (one-time password reset)
        env:
          DB_PASSWORD: ${{ secrets.PE_DB_PASSWORD }}
        run: |
          STACK_NAME="processing-engine"
          # ONE-TIME FIX: The pgdata volume was initialized with an empty password
          # during the first deploy. Even though PostgreSQL is "Running", it has the
          # wrong password stored in pg_hba.conf/data. We must nuke the volume.
          # TODO: Remove this step once the stack is stable with correct password.
          if docker stack ls | grep -q "^${STACK_NAME} "; then
            echo "Stack exists — removing for clean password reset..."
            docker stack rm "${STACK_NAME}"
            echo "Waiting for stack removal (services + networks)..."
            # Wait until the stack is fully removed (services, networks, containers)
            for i in $(seq 1 60); do
              # Check if any containers from the stack still exist (including on all nodes)
              REMAINING=$(docker ps -a --filter "label=com.docker.stack.namespace=${STACK_NAME}" -q | wc -l)
              # Also check if services still exist
              SVCS=$(docker service ls --filter "label=com.docker.stack.namespace=${STACK_NAME}" -q | wc -l)
              echo "  [$i/60] Remaining containers: ${REMAINING}, services: ${SVCS}"
              if [ "${REMAINING}" -eq 0 ] && [ "${SVCS}" -eq 0 ]; then
                echo "Stack fully removed."
                break
              fi
              sleep 2
            done
            # Extra wait to ensure filesystem handles are released
            sleep 5
            # Remove the volume with wrong password — MUST succeed
            echo "Removing pgdata volume..."
            if docker volume rm "${STACK_NAME}_pgdata" 2>&1; then
              echo "Volume removed successfully."
            else
              echo "WARNING: volume rm failed — trying force..."
              # List what might be using it
              docker volume inspect "${STACK_NAME}_pgdata" 2>&1 || true
              docker volume rm "${STACK_NAME}_pgdata" 2>&1 || echo "CRITICAL: Could not remove volume!"
            fi
            # Verify volume is gone
            if docker volume inspect "${STACK_NAME}_pgdata" >/dev/null 2>&1; then
              echo "CRITICAL: Volume still exists after removal attempt!"
              docker volume inspect "${STACK_NAME}_pgdata" 2>&1 || true
              exit 1
            else
              echo "Confirmed: volume does not exist."
            fi
            echo "Clean slate ready — will deploy with correct DB_PASSWORD."
          else
            echo "No existing stack — fresh deploy."
          fi

      - name: Deploy ou Update no Swarm
        env:
          IMAGE_SHA: ${{ needs.docker.outputs.image_sha }}
          TAG: ${{ needs.docker.outputs.image_sha }}
          DB_PASSWORD: ${{ secrets.PE_DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY: ${{ secrets.PE_API_KEY }}
        run: |
          IMG="${IMAGE_NAME}:${TAG}"

          # Pull da nova imagem no manager para que o Swarm nao re-baixe durante deploy
          echo "Pulling ${IMG}..."
          timeout 300 docker pull "${IMG}" || echo "WARNING: pull timed out — Swarm will pull via --with-registry-auth"

          echo "TAG=${TAG} | DB_PASSWORD is set: $([ -n \"${DB_PASSWORD}\" ] && echo yes || echo no)"
          echo "Image to deploy: ${IMG}"

          STACK_NAME="processing-engine"

          # docker stack deploy creates/updates the full stack (api + postgres)
          # env vars (TAG, DB_PASSWORD, OPENAI_API_KEY, API_KEY) are interpolated
          docker stack deploy \
            --with-registry-auth \
            --compose-file processing-engine/docker-stack.yml \
            "${STACK_NAME}"

          # Wait for postgres to be ready before forcing api update
          echo "Waiting for PostgreSQL to start..."
          for i in $(seq 1 30); do
            PG_STATE=$(docker service ps "${STACK_NAME}_postgres" --format "{{.CurrentState}}" 2>/dev/null | head -1 || echo "")
            echo "  [$i/30] PostgreSQL: ${PG_STATE}"
            if echo "${PG_STATE}" | grep -q "^Running"; then
              echo "PostgreSQL is running."
              break
            fi
            sleep 5
          done

          # Force the api service to use the new image (--detach to not block)
          # The Health Check step handles convergence monitoring
          echo "Forcing image update on api service..."
          docker service update \
            --image "${IMG}" \
            --with-registry-auth \
            --force \
            --detach \
            "${STACK_NAME}_api"

          echo "Service update dispatched. Health Check step will monitor convergence."

      - name: Health Check
        env:
          IMAGE_SHA: ${{ needs.docker.outputs.image_sha }}
          TAG: ${{ needs.docker.outputs.image_sha }}
        run: |
          SERVICE_NAME="processing-engine_api"
          echo "Expected image tag: ${TAG}"
          echo "Aguardando convergencia do servico..."

          for i in $(seq 1 60); do
            sleep 5
            # Get current state and image of the most recent task
            TASK_INFO=$(docker service ps "${SERVICE_NAME}" --format "{{.CurrentState}} | {{.Image}}" --no-trunc 2>/dev/null | head -1)
            echo "[$i/60] ${TASK_INFO}"

            STATE=$(echo "${TASK_INFO}" | cut -d'|' -f1 | xargs)

            if echo "${STATE}" | grep -q "^Running"; then
              # Verify it's actually healthy by checking the container
              echo "=== Service logs (last 20 lines) ==="
              docker service logs "${SERVICE_NAME}" --tail 20 2>&1 || true
              echo "Servico convergiu com sucesso!"
              exit 0
            fi

            # Every 30s, dump logs for debugging
            if [ $((i % 6)) -eq 0 ]; then
              echo "=== Periodic debug dump ==="
              docker service logs "${SERVICE_NAME}" --tail 10 2>&1 || true
              echo "=== PostgreSQL ==="
              docker service ps "processing-engine_postgres" --format "{{.CurrentState}}" 2>/dev/null | head -1
            fi
          done

          echo "Timeout (300s) esperando convergencia"
          echo "=== Final service logs ==="
          docker service logs "${SERVICE_NAME}" --tail 80 2>&1 || true
          echo "=== Final service PS ==="
          docker service ps "${SERVICE_NAME}" --no-trunc 2>&1 || true
          exit 1

      - name: Notify - Deploy Concluido
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'success','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Deploy concluido com sucesso - processing-engine.digital-ai.tech'
            }))")" || true

      - name: Notify - Deploy Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Falha no deploy do processing-engine no Docker Swarm'
            }))")" || true
