name: Processing Engine CI/CD

on:
  push:
    branches: [main]
    paths: ["processing-engine/**", ".github/workflows/processing-engine-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["processing-engine/**", ".github/workflows/processing-engine-ci.yml"]

# Cancel older runs on the same branch — only latest commit deploys
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digital-ai.tech
  N8N_NOTIFY_URL: https://webhook.digital-ai.tech/webhook/1c708636-864f-469d-8540-0dab5c145c7c
  IMAGE_NAME: registry.digital-ai.tech/processing-engine

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint
  # ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  # ──────────────────────────────────────────────
  # Job 2: Test (depends on lint)
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: processing-engine
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: processing_engine_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/processing_engine_test
      OPENAI_API_KEY: sk-test-dummy-key
      API_KEY: test-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          # Run migrations against service container
          alembic upgrade head
          # Unit + contract tests (no Docker-in-Docker needed)
          # E2E/integration tests use testcontainers and need Docker-in-Docker
          pytest tests/unit tests/contract -v --tb=short

  # ──────────────────────────────────────────────
  # Job 3: Build + Push to Registry (only on main push)
  # ──────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_sha: ${{ steps.meta.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Notify - Pipeline Iniciado
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'started','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Pipeline CI/CD','message':'Pipeline iniciado - lint e testes passaram'
            }))")" || true

      - name: Set image metadata
        id: meta
        run: echo "image_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: processing-engine
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify - Build Concluido
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA:0:8}"
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Build Docker','message':'Imagem pushed: registry.digital-ai.tech/processing-engine:${SHORT_SHA}'
            }))")" || true

      - name: Notify - Build Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Build Docker','message':'Falha no build ou push da imagem Docker'
            }))")" || true

  # ──────────────────────────────────────────────
  # Job 4: Deploy to Docker Swarm (self-hosted runner on Swarm node)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy — Swarm
    runs-on: [self-hosted, swarm]
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Notify - Deploy em Andamento
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Atualizando servico no Docker Swarm...'
            }))")" || true

      - name: Login no Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Pre-pull image
        env:
          TAG: ${{ needs.docker.outputs.image_sha }}
        run: |
          IMG="${IMAGE_NAME}:${TAG}"
          echo "Pulling ${IMG}..."
          timeout 300 docker pull "${IMG}"
          echo "Pull OK."

      - name: Deploy stack
        env:
          TAG: ${{ needs.docker.outputs.image_sha }}
          DB_PASSWORD: ${{ secrets.PE_DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY: ${{ secrets.PE_API_KEY }}
        run: |
          # Validate required secrets
          MISSING=""
          [ -z "${DB_PASSWORD}" ] && MISSING="${MISSING} PE_DB_PASSWORD"
          [ -z "${API_KEY}" ] && MISSING="${MISSING} PE_API_KEY"
          if [ -n "${MISSING}" ]; then
            echo "::error::Missing required GitHub Secrets:${MISSING}"
            exit 1
          fi
          echo "All secrets present (DB_PASSWORD length: ${#DB_PASSWORD})"

          # Export env vars — docker stack deploy interpolates from shell env
          export TAG DB_PASSWORD OPENAI_API_KEY API_KEY

          STACK_NAME="processing-engine"

          # Deploy (create or update). Env vars in docker-stack.yml are
          # interpolated by the shell at this point — no docker exec needed.
          # Same pattern as ifans.click which deploys successfully.
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3..."
            if docker stack deploy \
              --compose-file processing-engine/docker-stack.yml \
              --with-registry-auth \
              "${STACK_NAME}"; then
              echo "Stack deployed."
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Deploy failed. Retrying in 15s..."
              sleep 15
            else
              echo "Deploy failed after 3 attempts."
              exit 1
            fi
          done

      - name: Sync PostgreSQL password
        env:
          DB_PASSWORD: ${{ secrets.PE_DB_PASSWORD }}
        run: |
          STACK_NAME="processing-engine"
          echo "Syncing PostgreSQL password via Swarm task..."

          # Wait for PG to be Running first
          for i in $(seq 1 60); do
            PG_STATE=$(docker service ps "${STACK_NAME}_postgres" \
              --filter "desired-state=running" \
              --format "{{.CurrentState}}" 2>/dev/null | head -1)
            if echo "${PG_STATE}" | grep -q "^Running"; then
              echo "PostgreSQL is Running."
              break
            fi
            echo "  [$i/60] Waiting for PG: ${PG_STATE}"
            if [ "$i" -eq 60 ]; then
              echo "::error::PostgreSQL not running after 300s"
              exit 1
            fi
            sleep 5
          done

          # Find which node PG is on
          PG_NODE=$(docker service ps "${STACK_NAME}_postgres" \
            --filter "desired-state=running" \
            --format "{{.Node}}" 2>/dev/null | head -1)
          echo "PostgreSQL is on node: ${PG_NODE}"

          # Use a temporary service to run ALTER ROLE on the SAME node as PG.
          # This is the ONLY way to reach PG from CI when it's on a different node.
          # The temp service connects to PG via the pe-net overlay network.
          ESCAPED_PW=$(echo "${DB_PASSWORD}" | sed "s/'/''/g")
          echo "Creating temp service to sync password..."
          docker service create \
            --name pe-pw-sync \
            --network processing-engine_pe-net \
            --restart-condition none \
            --constraint "node.hostname==${PG_NODE}" \
            pgvector/pgvector:pg16 \
            sh -c "
              for i in \$(seq 1 30); do
                if PGPASSWORD='${ESCAPED_PW}' psql -h postgres -U postgres -d processing_engine -c 'SELECT 1' 2>/dev/null; then
                  echo 'Password already correct.'
                  exit 0
                fi
                # Try trust auth (Unix socket not available cross-container, try common passwords)
                for OLD_PW in '' 'changeme' 'postgres'; do
                  if PGPASSWORD=\"\${OLD_PW}\" psql -h postgres -U postgres -c \"ALTER ROLE postgres WITH PASSWORD '\${ESCAPED_PW}'\" 2>/dev/null; then
                    echo 'Password synced with old password.'
                    exit 0
                  fi
                done
                echo \"Attempt \$i/30 failed, retrying...\"
                sleep 2
              done
              echo 'WARNING: Could not sync password (PG may need manual intervention)'
              exit 1
            " 2>&1 || true

          # Wait for sync service to complete (max 90s)
          echo "Waiting for password sync..."
          for i in $(seq 1 18); do
            SYNC_STATE=$(docker service ps pe-pw-sync \
              --format "{{.CurrentState}}" 2>/dev/null | head -1)
            echo "  [$i/18] Sync: ${SYNC_STATE}"
            if echo "${SYNC_STATE}" | grep -q "^Complete"; then
              echo "Password sync completed."
              break
            fi
            if echo "${SYNC_STATE}" | grep -q "^Failed"; then
              echo "Password sync failed — checking logs..."
              docker service logs pe-pw-sync --raw 2>&1 || true
              break
            fi
            sleep 5
          done

          # Show sync logs and cleanup
          echo "=== Sync service logs ==="
          docker service logs pe-pw-sync --raw 2>&1 || true
          docker service rm pe-pw-sync 2>/dev/null || true
          echo "Sync step done."

      - name: Restart API after password sync
        run: |
          # Force the API service to restart so it picks up the (potentially updated) password
          echo "Restarting API service..."
          docker service update --force processing-engine_api 2>&1 || true
          echo "API restart triggered."

      - name: Health Check
        env:
          TAG: ${{ needs.docker.outputs.image_sha }}
        run: |
          SERVICE_NAME="processing-engine_api"
          echo "Aguardando convergencia do servico (max 5 min)..."

          # Wait for PostgreSQL service to report Running via Swarm API
          # (NOT docker ps/exec — PG may run on a different node)
          echo "--- Waiting for PostgreSQL ---"
          for i in $(seq 1 60); do
            PG_STATE=$(docker service ps processing-engine_postgres \
              --filter "desired-state=running" \
              --format "{{.CurrentState}}" 2>/dev/null | head -1 || echo "")
            echo "  [$i/60] PostgreSQL: ${PG_STATE}"
            if echo "${PG_STATE}" | grep -q "^Running"; then
              echo "PostgreSQL service is running."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::PostgreSQL failed to converge within 300s"
              docker service ps processing-engine_postgres --no-trunc 2>&1 || true
              exit 1
            fi
            sleep 5
          done

          # Wait for API service to converge
          echo "--- Waiting for API (start_period=120s, timeout=300s) ---"

          # Show where services are running (which node)
          echo "=== Service placement ==="
          docker service ps "${SERVICE_NAME}" --format "{{.Node}} {{.CurrentState}}" 2>/dev/null | head -3 || true
          docker service ps processing-engine_postgres --format "{{.Node}} {{.CurrentState}}" 2>/dev/null | head -1 || true
          echo "Runner hostname: $(hostname)"

          for i in $(seq 1 60); do
            TASK_INFO=$(docker service ps "${SERVICE_NAME}" \
              --filter "desired-state=running" \
              --format "{{.CurrentState}} | {{.Image}}" --no-trunc 2>/dev/null | head -1)
            echo "  [$i/60] API: ${TASK_INFO}"

            STATE=$(echo "${TASK_INFO}" | cut -d'|' -f1 | xargs)

            if echo "${STATE}" | grep -q "^Running"; then
              echo "API service convergiu!"
              docker service logs "${SERVICE_NAME}" --tail 20 --raw 2>&1 || true
              exit 0
            fi

            # Dump detailed diagnostics at 30s, 90s, 150s, etc.
            if [ "$i" -eq 6 ] || [ "$i" -eq 18 ] || [ "$i" -eq 30 ] || [ "$i" -eq 50 ]; then
              echo "=== DIAGNOSTIC (iteration $i) ==="
              echo "--- Task States ---"
              docker service ps "${SERVICE_NAME}" --no-trunc \
                --format "table {{.Name}}\t{{.Node}}\t{{.CurrentState}}\t{{.Error}}" 2>&1 | head -15 || true
              echo "--- Container Logs (service logs --raw) ---"
              docker service logs "${SERVICE_NAME}" --tail 60 --raw 2>&1 || true
              echo "--- Service Inspect (update status) ---"
              docker service inspect "${SERVICE_NAME}" --format '{{json .UpdateStatus}}' 2>/dev/null || true
              echo ""
              echo "=== END DIAGNOSTIC ==="
            fi

            sleep 5
          done

          echo "::error::API service failed to converge within 300s"
          echo "=== FINAL DIAGNOSTIC ==="
          docker service ps "${SERVICE_NAME}" --no-trunc \
            --format "table {{.Name}}\t{{.Node}}\t{{.CurrentState}}\t{{.Error}}" 2>&1 | head -20 || true
          echo "--- Final Container Logs ---"
          docker service logs "${SERVICE_NAME}" --tail 100 --raw 2>&1 || true
          echo "--- Update Status ---"
          docker service inspect "${SERVICE_NAME}" --format '{{json .UpdateStatus}}' 2>/dev/null || true
          exit 1

      - name: Notify - Deploy Concluido
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'success','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Deploy concluido com sucesso - processing-engine.digital-ai.tech'
            }))")" || true

      - name: Notify - Deploy Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Falha no deploy do processing-engine no Docker Swarm'
            }))")" || true
