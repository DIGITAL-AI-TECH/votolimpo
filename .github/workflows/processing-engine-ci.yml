name: Processing Engine CI/CD

on:
  push:
    branches: [main]
    paths: ["processing-engine/**", ".github/workflows/processing-engine-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["processing-engine/**", ".github/workflows/processing-engine-ci.yml"]

# Cancel older runs on the same branch — only latest commit deploys
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digital-ai.tech
  N8N_NOTIFY_URL: https://webhook.digital-ai.tech/webhook/1c708636-864f-469d-8540-0dab5c145c7c
  IMAGE_NAME: registry.digital-ai.tech/processing-engine

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint
  # ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  # ──────────────────────────────────────────────
  # Job 2: Test (depends on lint)
  # ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: processing-engine
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: processing_engine_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/processing_engine_test
      OPENAI_API_KEY: sk-test-dummy-key
      API_KEY: test-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          # Run migrations against service container
          alembic upgrade head
          # Unit + contract tests (no Docker-in-Docker needed)
          # E2E/integration tests use testcontainers and need Docker-in-Docker
          pytest tests/unit tests/contract -v --tb=short

  # ──────────────────────────────────────────────
  # Job 3: Build + Push to Registry (only on main push)
  # ──────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_sha: ${{ steps.meta.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Notify - Pipeline Iniciado
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'started','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Pipeline CI/CD','message':'Pipeline iniciado - lint e testes passaram'
            }))")" || true

      - name: Set image metadata
        id: meta
        run: echo "image_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: processing-engine
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify - Build Concluido
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${SHA:0:8}"
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Build Docker','message':'Imagem pushed: registry.digital-ai.tech/processing-engine:${SHORT_SHA}'
            }))")" || true

      - name: Notify - Build Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Build Docker','message':'Falha no build ou push da imagem Docker'
            }))")" || true

  # ──────────────────────────────────────────────
  # Job 4: Deploy to Docker Swarm (self-hosted runner on Swarm node)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy — Swarm
    runs-on: [self-hosted, swarm]
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Notify - Deploy em Andamento
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'info','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Atualizando servico no Docker Swarm...'
            }))")" || true

      - name: Login no Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Pre-pull image
        env:
          TAG: ${{ needs.docker.outputs.image_sha }}
        run: |
          IMG="${IMAGE_NAME}:${TAG}"
          echo "Pulling ${IMG}..."
          timeout 300 docker pull "${IMG}"
          echo "Pull OK."

      - name: Validate secrets
        env:
          DB_PASSWORD: ${{ secrets.PE_DB_PASSWORD }}
          API_KEY: ${{ secrets.PE_API_KEY }}
        run: |
          MISSING=""
          [ -z "${DB_PASSWORD}" ] && MISSING="${MISSING} PE_DB_PASSWORD"
          [ -z "${API_KEY}" ] && MISSING="${MISSING} PE_API_KEY"
          if [ -n "${MISSING}" ]; then
            echo "::error::Missing required GitHub Secrets:${MISSING}"
            exit 1
          fi
          echo "All secrets present (DB_PASSWORD length: ${#DB_PASSWORD})"

      - name: Reset stack & PG volume (clean password state)
        timeout-minutes: 3
        run: |
          STACK_NAME="processing-engine"

          # Clean up any leftover temp services from previous failed runs
          docker service rm pe-pw-sync 2>/dev/null || true

          # Show existing volumes before cleanup
          echo "=== Volumes before cleanup ==="
          docker volume ls --filter "name=processing" 2>/dev/null || true

          # Remove existing stack so PG volume can be reset
          # (POSTGRES_PASSWORD env var only applies on first initdb — if the
          # volume already has an old password, the DB ignores the env var)
          if docker stack ls --format "{{.Name}}" | grep -q "^${STACK_NAME}$"; then
            echo "Removing existing stack..."
            docker stack rm "${STACK_NAME}"
            # Wait for ALL containers (not just services) to be fully gone
            for i in $(seq 1 30); do
              SERVICES=$(docker service ls --filter "name=${STACK_NAME}" -q 2>/dev/null | wc -l)
              CONTAINERS=$(docker ps -q --filter "name=${STACK_NAME}" 2>/dev/null | wc -l)
              if [ "$SERVICES" -eq 0 ] && [ "$CONTAINERS" -eq 0 ]; then
                echo "Stack fully removed (${i}×3s). Services=0, Containers=0."
                break
              fi
              echo "  [$i/30] Waiting... (services=$SERVICES, containers=$CONTAINERS)"
              sleep 3
            done
            # Extra grace period for Docker to release volume references
            echo "Grace period for volume release..."
            sleep 5
          fi

          # Show volumes after stack removal
          echo "=== Volumes after stack removal ==="
          docker volume ls --filter "name=processing" 2>/dev/null || true

          # Remove PG data volume with retry (container may still be releasing it)
          VOLUME_NAME="${STACK_NAME}_pgdata"
          VOLUME_REMOVED=false
          for attempt in $(seq 1 5); do
            if docker volume rm "${VOLUME_NAME}" 2>&1; then
              echo "PG volume '${VOLUME_NAME}' removed on attempt ${attempt}."
              VOLUME_REMOVED=true
              break
            else
              echo "  Volume rm attempt ${attempt}/5 failed (may still be in use). Waiting 5s..."
              sleep 5
            fi
          done

          if [ "$VOLUME_REMOVED" = "false" ]; then
            echo "WARNING: Could not remove volume '${VOLUME_NAME}'. Checking if it exists..."
            if docker volume inspect "${VOLUME_NAME}" >/dev/null 2>&1; then
              echo "::error::Volume ${VOLUME_NAME} EXISTS but cannot be removed — PG will reuse old data/password!"
              docker volume inspect "${VOLUME_NAME}" 2>&1 || true
              exit 1
            else
              echo "Volume does not exist — PG will do fresh initdb. OK."
            fi
          fi

          echo "=== Volumes after cleanup ==="
          docker volume ls --filter "name=processing" 2>/dev/null || true
          echo "Ready for fresh deploy."

      - name: Deploy stack
        env:
          TAG: ${{ needs.docker.outputs.image_sha }}
          # Use a simple known password to test if special chars in the
          # GitHub Secret are the root cause of InvalidPasswordError.
          # TODO: revert to ${{ secrets.PE_DB_PASSWORD }} once confirmed working.
          DB_PASSWORD: "processing_engine_2026"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY: ${{ secrets.PE_API_KEY }}
        run: |
          export TAG DB_PASSWORD OPENAI_API_KEY API_KEY
          STACK_NAME="processing-engine"

          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3..."
            if docker stack deploy \
              --compose-file processing-engine/docker-stack.yml \
              --with-registry-auth \
              "${STACK_NAME}"; then
              echo "Stack deployed."
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Deploy failed. Retrying in 10s..."
              sleep 10
            else
              echo "::error::Deploy failed after 3 attempts."
              exit 1
            fi
          done

      - name: Health Check
        env:
          TAG: ${{ needs.docker.outputs.image_sha }}
          DB_PASSWORD: "processing_engine_2026"
        run: |
          SERVICE_NAME="processing-engine_api"
          echo "Aguardando convergencia do servico (max 5 min)..."

          # Debug: show password hash for both services (never plaintext!)
          echo "=== Password Debug ==="
          PW_LEN=${#DB_PASSWORD}
          PW_MD5=$(echo -n "${DB_PASSWORD}" | md5sum | cut -d' ' -f1)
          echo "GitHub Secret PE_DB_PASSWORD: len=${PW_LEN}, md5=${PW_MD5}"

          # Show what env vars the services actually have (password masked)
          echo "--- API service env (DB_PASSWORD) ---"
          docker service inspect processing-engine_api --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' 2>/dev/null | grep -E "DB_PASSWORD|POSTGRES_PASSWORD" | sed 's/=.*/=***/' || echo "N/A"
          echo "--- PG service env (POSTGRES_PASSWORD) ---"
          docker service inspect processing-engine_postgres --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' 2>/dev/null | grep -E "DB_PASSWORD|POSTGRES_PASSWORD" | sed 's/=.*/=***/' || echo "N/A"

          # Wait for PostgreSQL service to report Running via Swarm API
          echo "--- Waiting for PostgreSQL ---"
          for i in $(seq 1 60); do
            PG_STATE=$(docker service ps processing-engine_postgres \
              --filter "desired-state=running" \
              --format "{{.CurrentState}}" 2>/dev/null | head -1 || echo "")
            echo "  [$i/60] PostgreSQL: ${PG_STATE}"
            if echo "${PG_STATE}" | grep -q "^Running"; then
              echo "PostgreSQL service is running."
              sleep 5  # give PG a moment to finish init
              echo "--- PostgreSQL Logs (initdb check) ---"
              docker service logs processing-engine_postgres --tail 30 --raw 2>&1 | head -40 || true

              # === CRITICAL DIAGNOSTIC: Test PG auth from inside the container ===
              PG_CONTAINER=$(docker ps -q --filter "name=processing-engine_postgres" | head -1)
              if [ -n "$PG_CONTAINER" ]; then
                echo "=== PG Container Auth Test (container: ${PG_CONTAINER}) ==="
                echo "--- MD5 of POSTGRES_PASSWORD inside PG container ---"
                docker exec "$PG_CONTAINER" sh -c 'echo -n "$POSTGRES_PASSWORD" | md5sum' 2>&1 || echo "  (failed to get md5)"
                echo "--- MD5 of DB_PASSWORD from GitHub Secret ---"
                echo -n "${DB_PASSWORD}" | md5sum
                echo "--- Local socket auth (should always work) ---"
                docker exec "$PG_CONTAINER" psql -U postgres -c "SELECT 1 AS socket_auth_ok;" 2>&1 || echo "  SOCKET AUTH FAILED!"
                echo "--- TCP auth with POSTGRES_PASSWORD via container IP (scram-sha-256) ---"
                docker exec "$PG_CONTAINER" sh -c 'MY_IP=$(hostname -i | awk "{print \$1}"); echo "Testing auth via $MY_IP"; PGPASSWORD=$POSTGRES_PASSWORD psql -h $MY_IP -U postgres -c "SELECT 1 AS real_scram_auth_ok;"' 2>&1 || echo "  SCRAM AUTH FAILED!"
                echo "--- pg_hba.conf ---"
                docker exec "$PG_CONTAINER" cat /var/lib/postgresql/data/pg_hba.conf 2>&1 | grep -v "^#" | grep -v "^$" || true
                echo "--- Check password in pg_authid ---"
                docker exec "$PG_CONTAINER" psql -U postgres -c "SELECT rolname, rolpassword IS NOT NULL AS has_password, length(rolpassword) AS pw_hash_len FROM pg_authid WHERE rolname='postgres';" 2>&1 || true
                echo "=== END PG Auth Test ==="

                # Test from ANOTHER container via overlay network
                # (simulates what the API does — crosses nodes)
                echo "=== Overlay Network Auth Test (cross-container) ==="
                docker run --rm --network processing-engine_pe-net \
                  -e PGPASSWORD="${DB_PASSWORD}" \
                  pgvector/pgvector:pg16 \
                  psql -h postgres -U postgres -d processing_engine \
                  -c "SELECT 1 AS overlay_psql_auth_ok;" 2>&1 || echo "  OVERLAY PSQL AUTH FAILED!"

                # Test with asyncpg specifically (same image as API)
                echo "--- Overlay asyncpg test ---"
                docker run --rm --network processing-engine_pe-net \
                  -e DB_PASSWORD="${DB_PASSWORD}" \
                  "${IMAGE_NAME}:${TAG}" \
                  python -c "
import asyncio, os
async def test():
    import asyncpg
    pw = os.environ['DB_PASSWORD']
    print(f'asyncpg test: pw_len={len(pw)}')
    conn = await asyncpg.connect(host='postgres', port=5432, user='postgres', password=pw, database='processing_engine')
    print('asyncpg: CONNECTED OK')
    await conn.close()
asyncio.run(test())
" 2>&1 || echo "  ASYNCPG OVERLAY AUTH FAILED!"
                echo "=== END Overlay Auth Test ==="
              else
                echo "WARNING: PG container not found on this node ($(hostname)). Cannot run local auth test."
              fi
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::PostgreSQL failed to converge within 300s"
              docker service ps processing-engine_postgres --no-trunc 2>&1 || true
              docker service logs processing-engine_postgres --tail 50 --raw 2>&1 || true
              exit 1
            fi
            sleep 5
          done

          # Wait for API service to converge
          echo "--- Waiting for API (start_period=120s, timeout=300s) ---"

          # Show where services are running (which node)
          echo "=== Service placement ==="
          docker service ps "${SERVICE_NAME}" --format "{{.Node}} {{.CurrentState}}" 2>/dev/null | head -3 || true
          docker service ps processing-engine_postgres --format "{{.Node}} {{.CurrentState}}" 2>/dev/null | head -1 || true
          echo "Runner hostname: $(hostname)"

          for i in $(seq 1 60); do
            TASK_INFO=$(docker service ps "${SERVICE_NAME}" \
              --filter "desired-state=running" \
              --format "{{.CurrentState}} | {{.Image}}" --no-trunc 2>/dev/null | head -1)
            echo "  [$i/60] API: ${TASK_INFO}"

            STATE=$(echo "${TASK_INFO}" | cut -d'|' -f1 | xargs)

            if echo "${STATE}" | grep -q "^Running"; then
              echo "API service convergiu!"
              docker service logs "${SERVICE_NAME}" --tail 20 --raw 2>&1 || true
              exit 0
            fi

            # Dump detailed diagnostics at key iterations
            if [ "$i" -eq 6 ] || [ "$i" -eq 18 ] || [ "$i" -eq 30 ] || [ "$i" -eq 50 ]; then
              echo "=== DIAGNOSTIC (iteration $i) ==="
              echo "--- Task States ---"
              docker service ps "${SERVICE_NAME}" --no-trunc \
                --format "table {{.Name}}\t{{.Node}}\t{{.CurrentState}}\t{{.Error}}" 2>&1 | head -15 || true
              echo "--- Container Logs (service logs --raw) ---"
              docker service logs "${SERVICE_NAME}" --tail 200 --raw 2>&1 || true
              echo "--- Service Inspect (update status) ---"
              docker service inspect "${SERVICE_NAME}" --format '{{json .UpdateStatus}}' 2>/dev/null || true
              echo ""
              echo "=== END DIAGNOSTIC ==="
            fi

            sleep 5
          done

          echo "::error::API service failed to converge within 300s"
          echo "=== FINAL DIAGNOSTIC ==="
          docker service ps "${SERVICE_NAME}" --no-trunc \
            --format "table {{.Name}}\t{{.Node}}\t{{.CurrentState}}\t{{.Error}}" 2>&1 | head -20 || true
          echo "--- Final Container Logs ---"
          docker service logs "${SERVICE_NAME}" --tail 100 --raw 2>&1 || true
          echo "--- Update Status ---"
          docker service inspect "${SERVICE_NAME}" --format '{{json .UpdateStatus}}' 2>/dev/null || true
          exit 1

      - name: Notify - Deploy Concluido
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'success','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Deploy concluido com sucesso - processing-engine.digital-ai.tech'
            }))")" || true

      - name: Notify - Deploy Falhou
        if: failure()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,os; print(json.dumps({
              'status':'failure','repo':'votolimpo/processing-engine',
              'branch':os.environ['BRANCH'],'actor':os.environ['ACTOR'],
              'commit_sha':os.environ['SHA'],'commit_message':os.environ['COMMIT_MSG'],
              'run_url':os.environ['RUN_URL'],
              'stage':'Deploy Swarm','message':'Falha no deploy do processing-engine no Docker Swarm'
            }))")" || true
