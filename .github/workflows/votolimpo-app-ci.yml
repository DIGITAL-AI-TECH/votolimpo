name: "VotoLimpo App — Build, Push & Deploy"

on:
  push:
    branches: [main]
    paths:
      - "votolimpo-app/**"
      - ".github/workflows/votolimpo-app-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "votolimpo-app/**"
      - ".github/workflows/votolimpo-app-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digital-ai.tech
  IMAGE_NAME: registry.digital-ai.tech/votolimpo-app
  N8N_NOTIFY_URL: https://webhook.digital-ai.tech/webhook/1c708636-864f-469d-8540-0dab5c145c7c

jobs:
  # ── Job 0: Lint + Typecheck + Tests ────────────────────
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: votolimpo-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Unit tests
        run: pnpm test:ci

  # ── Job 1: Build + Push ─────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      image_sha: ${{ steps.meta.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Notify -- Pipeline Iniciado
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg branch "$BRANCH" --arg actor "$ACTOR" --arg sha "$SHA" \
              --arg msg "$COMMIT_MSG" --arg url "$RUN_URL" \
              '{status:"started",repo:"votolimpo-app",branch:$branch,actor:$actor,
                commit_sha:$sha,commit_message:$msg,run_url:$url,
                stage:"Pipeline CI/CD",message:"Pipeline iniciado — build da imagem Next.js"}')" || true

      - name: Set image metadata
        id: meta
        run: echo "image_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: votolimpo-app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify -- Build OK
        if: success()
        env:
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMG_TAG: ${{ steps.meta.outputs.image_sha }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg branch "$BRANCH" --arg actor "$ACTOR" --arg sha "$SHA" \
              --arg url "$RUN_URL" --arg tag "$IMG_TAG" \
              '{status:"info",repo:"votolimpo-app",branch:$branch,actor:$actor,
                commit_sha:$sha,run_url:$url,stage:"Build Docker",
                message:("Imagem pushed: registry.digital-ai.tech/votolimpo-app:" + $tag)}')" || true

      - name: Notify -- Build Falhou
        if: failure()
        env:
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg branch "$BRANCH" --arg actor "$ACTOR" --arg sha "$SHA" --arg url "$RUN_URL" \
              '{status:"failure",repo:"votolimpo-app",branch:$branch,actor:$actor,
                commit_sha:$sha,run_url:$url,stage:"Build Docker",
                message:"Build da imagem falhou"}')" || true

  # ── Job 2: Deploy via Portainer API ───
  deploy:
    name: Deploy — Swarm (Portainer API)
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Notify -- Deploy em Andamento
        env:
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg branch "$BRANCH" --arg actor "$ACTOR" --arg sha "$SHA" --arg url "$RUN_URL" \
              '{status:"info",repo:"votolimpo-app",branch:$branch,actor:$actor,
                commit_sha:$sha,run_url:$url,stage:"Deploy Swarm",
                message:"Atualizando service via Portainer API..."}')" || true

      - uses: actions/checkout@v4

      - name: Update stack via Portainer API
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          IMAGE_TAG: ${{ needs.docker.outputs.image_sha }}
          NC_API_TOKEN: ${{ secrets.NC_API_TOKEN }}
        run: |
          set -e
          STACK_ID=352
          ENDPOINT_ID=4

          echo "Updating stack votolimpo-app (ID=${STACK_ID}) with IMAGE_TAG=${IMAGE_TAG}"

          PAYLOAD=$(jq -n \
            --arg compose "$(cat votolimpo-app/docker-stack.yml)" \
            --arg nc_token "$NC_API_TOKEN" \
            --arg img_tag "$IMAGE_TAG" \
            '{StackFileContent: $compose, Env: [{name: "NC_API_TOKEN", value: $nc_token}, {name: "IMAGE_TAG", value: $img_tag}], Prune: true}')

          HTTP_CODE=$(curl -s -o /tmp/portainer_response.json -w "%{http_code}" \
            -X PUT "${PORTAINER_URL}/api/stacks/${STACK_ID}?endpointId=${ENDPOINT_ID}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Portainer response HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "ERROR: Portainer API returned ${HTTP_CODE}"
            cat /tmp/portainer_response.json
            exit 1
          fi

          echo "Stack updated successfully. Waiting for convergence..."

          SERVICE_NAME="votolimpo-app_app"
          for i in $(seq 1 24); do
            sleep 10
            UPDATE_STATE=$(curl -s \
              -H "X-API-Key: ${PORTAINER_API_KEY}" \
              "${PORTAINER_URL}/api/endpoints/${ENDPOINT_ID}/docker/services" | \
              jq -r --arg svc "$SERVICE_NAME" '.[] | select(.Spec.Name == $svc) | .UpdateStatus.State // "unknown"')
            echo "Attempt ${i}/24 — UpdateStatus: ${UPDATE_STATE}"
            if [ "$UPDATE_STATE" = "completed" ]; then
              echo "Service converged successfully."
              exit 0
            elif [ "$UPDATE_STATE" = "rollback_completed" ]; then
              echo "ERROR: Service rolled back automatically."
              exit 1
            elif [ "$UPDATE_STATE" = "paused" ]; then
              echo "ERROR: Service update paused due to failure."
              exit 1
            fi
          done

          echo "WARNING: Convergence timeout (240s). Check Portainer manually."
          exit 1

      - name: Notify -- Deploy Concluido
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg branch "$BRANCH" --arg actor "$ACTOR" --arg sha "$SHA" \
              --arg msg "$COMMIT_MSG" --arg url "$RUN_URL" \
              '{status:"success",repo:"votolimpo-app",branch:$branch,actor:$actor,
                commit_sha:$sha,commit_message:$msg,run_url:$url,
                message:"Deploy concluido: https://votolimpo.com.br"}')" || true

      - name: Notify -- Deploy Falhou
        if: failure()
        env:
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST "${N8N_NOTIFY_URL}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg branch "$BRANCH" --arg actor "$ACTOR" --arg sha "$SHA" --arg url "$RUN_URL" \
              '{status:"failure",repo:"votolimpo-app",branch:$branch,actor:$actor,
                commit_sha:$sha,run_url:$url,stage:"Deploy Swarm",
                message:"Deploy falhou no Docker Swarm"}')" || true
