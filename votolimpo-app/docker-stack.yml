version: "3.8"

services:
  app:
    image: registry.digital-ai.tech/votolimpo-app:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NC_API_URL=http://news-collector_news-collector-api:8000
      - NC_API_TOKEN=${NC_API_TOKEN}
      - NEXT_PUBLIC_APP_URL=https://votolimpo.com.br
    networks:
      - oraculusnet
      - votolimpo-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--timeout=5", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=oraculusnet"
        - "traefik.http.routers.votolimpo.rule=Host(`votolimpo.com.br`) || Host(`www.votolimpo.com.br`)"
        - "traefik.http.routers.votolimpo.entrypoints=websecure"
        - "traefik.http.routers.votolimpo.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.votolimpo.loadbalancer.server.port=3000"
        # HTTP -> HTTPS redirect
        - "traefik.http.routers.votolimpo-http.rule=Host(`votolimpo.com.br`) || Host(`www.votolimpo.com.br`)"
        - "traefik.http.routers.votolimpo-http.entrypoints=web"
        - "traefik.http.routers.votolimpo-http.middlewares=redirect-to-https"
        # Redirect www to non-www
        - "traefik.http.middlewares.votolimpo-www-redirect.redirectregex.regex=^https://www\\.votolimpo\\.com\\.br/(.*)"
        - "traefik.http.middlewares.votolimpo-www-redirect.redirectregex.replacement=https://votolimpo.com.br/$${1}"
        - "traefik.http.middlewares.votolimpo-www-redirect.redirectregex.permanent=true"
        - "traefik.http.routers.votolimpo.middlewares=votolimpo-www-redirect"
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 192M

networks:
  oraculusnet:
    external: true
  votolimpo-net:
    external: true
