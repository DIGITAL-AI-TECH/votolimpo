version: "3.8"

services:
  app:
    image: registry.digital-ai.tech/helpcore-platform:${IMAGE_TAG:-latest}
    networks:
      - oraculusnet
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.helpcore.rule=Host(`helpcore.digital-ai.tech`)"
        - "traefik.http.routers.helpcore.entrypoints=websecure"
        - "traefik.http.routers.helpcore.tls.certresolver=letsencrypt"
        - "traefik.http.services.helpcore.loadbalancer.server.port=3000"
        - "traefik.http.routers.helpcore-http.rule=Host(`helpcore.digital-ai.tech`)"
        - "traefik.http.routers.helpcore-http.entrypoints=web"
        - "traefik.http.routers.helpcore-http.middlewares=redirect-to-https"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HELPCORE_AUTH_PASSWORD=${HELPCORE_AUTH_PASSWORD}
      - HELPCORE_AUTH_SECRET=${HELPCORE_AUTH_SECRET}

networks:
  oraculusnet:
    external: true
